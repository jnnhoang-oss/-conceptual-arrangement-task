<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Conceptual Arrangement Task</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" type='text/css' media='screen' href="styles.css" />
</head>
<body>  
    
<div class="app" style="display:flex;gap:30px;">
  <div id="imagePool" style="width:280px;border:2px dashed #ccc;padding:10px;">
    <h3>Image Pool</h3>
  </div>

  <div id="arena" style="
    width:680px;
    height:680px;
    border-radius:50%;
    border:4px solid #222;
    position:relative;
    overflow:hidden;
    background:#fafafa;
  ">
  </div>
</div>

<div id="floatingMsg" style="
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.7);
  color:white;
  padding:8px 16px;
  border-radius:8px;
  font-size:16px;
  display:none;
  z-index:1000;
"></div>

<div id="sessionInfo" style="margin-top:20px;font-weight:500;"></div>

<!-- instruction screen -->
<div id="instructions" style="
  position:fixed;
  inset:0;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  font-size:20px;
  z-index:100;
">
  <div style="max-width:700px;">
    <p>In this experiment, you will use the mouse to click and drag images around the screen.</p>
    <p>Drag them from the left panel into the circular arena on the right, and arrange them so conceptually similar items are closer together.</p>
    <p>Press the spacebar or click below to begin.</p>
  </div>
  <button id="beginBtn" style="margin-top:20px;padding:10px 20px;font-size:18px;">Begin</button>
</div>

<!-- overlay screen (for Space → F → Space → Enter transitions) -->
<div id="overlayScreen" style="
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.96);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:200;
  text-align:center;
  font-size:20px;
  padding:40px;
">
  <div id="overlayText" style="max-width:700px;line-height:1.5;color:#222;"></div>
  <button id="continueBtn" style="margin-top:20px;padding:10px 24px;">Continue</button>
</div>
    
</body>
<script scr='script.js'></script>
</html>
